zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: bd122165ed754292977c6a02ae83b229
      name: Templates/Printers
  templates:
    - uuid: 10db3a0a88f44e39a62f4555e9522fe4
      template: 'Template Canon LBP242 II 243 II SNMP'
      name: 'Template Canon LBP242 II 243 II SNMP'
      groups:
        - name: Templates/Printers
      items:
        - uuid: 112fff9104144ab98817a9e1e946a9dc
          name: 'Pages printed on current toner'
          type: CALCULATED
          key: canon.pages.current_toner
          delay: 5m
          value_type: FLOAT
          units: pages
          params: 'last(//printer.pages.lifetime)-{$CANON.TONER.BASE.PAGES}'
        - uuid: 3d50972bbe3747b99a6f9696ffe2e1a7
          name: 'Ethernet Incoming Discards'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.2.2.1.13.1
          key: 'net.if.in.discards[1]'
          delay: 5m
          history: 7d
          description: 'ifInDiscards cumulative counter.'
        - uuid: f92cb94bcd26437caad7c2eb17769c16
          name: 'Ethernet Incoming Errors'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.2.2.1.14.1
          key: 'net.if.in.errors[1]'
          delay: 5m
          history: 7d
          description: 'ifInErrors cumulative counter.'
        - uuid: 4252bde548234baca0b50084697460f5
          name: 'Ethernet Incoming Traffic'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.2.2.1.10.1
          key: 'net.if.in[1]'
          history: 7d
          units: Bps
          description: 'Incoming octets; stored as change per second.'
          preprocessing:
            - type: CHANGE_PER_SECOND
        - uuid: 7a8ce85e65904d6da737f899d105fd99
          name: 'Ethernet Outgoing Traffic'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.2.2.1.16.1
          key: 'net.if.out[1]'
          history: 7d
          units: Bps
          description: 'Outgoing octets; stored as change per second.'
          preprocessing:
            - type: CHANGE_PER_SECOND
        - uuid: 8761ff79c2b14bde860871455e3a0ab5
          name: 'Ethernet Interface Speed'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.2.2.1.5.1
          key: 'net.if.speed[1]'
          delay: 5m
          history: 7d
          units: bps
          description: 'ifSpeed for interface index 1.'
        - uuid: 4aa01d4c8d9b434aa7a4bdb334458534
          name: 'Ethernet Interface Operational Status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.2.2.1.8.1
          key: 'net.if.status[1]'
          history: 7d
          description: 'ifOperStatus for interface index 1.'
          triggers:
            - uuid: 9be7046d3d544f778a14fa35ccaf18e0
              expression: 'last(/Template Canon LBP242 II 243 II SNMP/net.if.status[1])<>1'
              name: 'Printer Ethernet link is down'
              priority: HIGH
              description: 'FastEthernet interface index 1 is not operational.'
              manual_close: 'YES'
        - uuid: a694ded1b97b4592bdb937f7dbcb9444
          name: 'Canon Counter - Copy Total 1'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1602.1.11.2.1.1.3.17
          key: printer.canon.copy.total1
          delay: 5m
          history: 7d
          units: pages
          description: 'Canon private counter Copy (Total 1).'
        - uuid: 340d2f384b4849e38f502d9317f3d035
          name: 'Canon Counter - Print Total 1'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1602.1.11.2.1.1.3.25
          key: printer.canon.print.total1
          delay: 5m
          history: 7d
          units: pages
          description: 'Canon private counter Print (Total 1).'
        - uuid: d7516716d0a647aeac0a3165db767dc8
          name: 'Canon Counter - Receive Print Total 1'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1602.1.11.2.1.1.3.32
          key: printer.canon.receiveprint.total1
          delay: 5m
          history: 7d
          units: pages
          description: 'Canon private counter Receive Print (Total 1).'
        - uuid: 8211bb831c3544e99b8353221ca4208e
          name: 'Canon Counter - Scan Total 1'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1602.1.11.2.1.1.3.31
          key: printer.canon.scan.total1
          delay: 5m
          history: 7d
          units: pages
          description: 'Canon private counter Scan (Total 1).'
        - uuid: fb368c06bd794c6d9ee690adfa4f9565
          name: 'Canon Counter - Total 1'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1602.1.11.2.1.1.3.1
          key: printer.canon.total1
          delay: 5m
          history: 7d
          units: pages
          description: 'Canon private counter Total 1.'
        - uuid: 5262fb54fef048f184a2c4f548936bbd
          name: 'Canon Counter - Total 1 (2-Sided)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1602.1.11.2.1.1.3.10
          key: printer.canon.total1.2sided
          delay: 5m
          history: 7d
          units: pages
          description: 'Canon private counter Total 1 (2-Sided).'
        - uuid: 30e38457dddd486ea76497ad7fa10baf
          name: 'Canon Counter - Total 2'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1602.1.11.2.1.1.3.2
          key: printer.canon.total2
          delay: 5m
          history: 7d
          units: pages
          description: 'Canon private counter Total 2.'
        - uuid: e654afa042a640c38225eeab54c01476
          name: 'Printer Error State'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.25.3.5.1.2.1
          key: printer.error.state
          history: 7d
          value_type: CHAR
          description: 'Host Resources printer error-state bitmap.'
        - uuid: a85b60d8b20c44db804870575dba7810
          name: 'Firmware - BOOT_ROM'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1602.1.4.7.1.1.4.2
          key: printer.firmware.boot
          delay: 1h
          history: 7d
          value_type: CHAR
          description: 'Canon BOOT_ROM firmware version.'
        - uuid: 3a9b41c443894dabba10fdff31d12712
          name: 'Firmware - ECONT'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1602.1.4.7.1.1.4.3
          key: printer.firmware.econt
          delay: 1h
          history: 7d
          value_type: CHAR
          description: 'Canon ECONT firmware version.'
        - uuid: 57e70d95cdb949d19990c6177fcf63cf
          name: 'Firmware - MAIN_ROM'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.1602.1.4.7.1.1.4.1
          key: printer.firmware.main
          delay: 1h
          history: 7d
          value_type: CHAR
          description: 'Canon MAIN_ROM firmware version.'
        - uuid: a654ea33334643759f4a070a4392aa37
          name: 'Printer Location'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.6.0
          key: printer.location
          delay: 1h
          history: 7d
          value_type: CHAR
          description: 'SNMP system location.'
        - uuid: 1a2421255e1a40c7a15098ae6e0909db
          name: 'Printer Model'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: printer.model
          delay: 1h
          history: 7d
          value_type: TEXT
          description: 'Printer model/system description.'
        - uuid: 3b27cd597b754c9da45fc74695457eaf
          name: 'Lifetime Page Counter'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.10.2.1.4.1.1
          key: printer.pages.lifetime
          delay: 5m
          history: 7d
          units: pages
          description: 'Standard Printer-MIB prtMarkerLifeCount.'
          triggers:
            - uuid: 02bf670c15b34f8aa5f7a0d0ce8a3415
              expression: 'change(/Template Canon LBP242 II 243 II SNMP/printer.pages.lifetime)<0'
              name: 'Printer lifetime counter decreased'
              priority: WARNING
              description: 'Lifetime counter decreased; investigate printer replacement, reset, or counter anomaly.'
              manual_close: 'YES'
        - uuid: 46aa292c8d3b4cfcb2674567b3fa9250
          name: 'Printer Serial'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.5.1.1.17.1
          key: printer.serial
          delay: 1h
          history: 7d
          value_type: CHAR
          description: 'Printer serial/identification string.'
        - uuid: 30cfd208c84f4bf994a9bcbcc4f54b46
          name: 'Printer Status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.25.3.5.1.1.1
          key: printer.status
          history: 7d
          description: 'Host Resources printer status enum.'
        - uuid: d47e32e971bd4515b720d48c08c9e88e
          name: 'Black Toner Description'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.6.1.1
          key: printer.toner.black.description
          delay: 1h
          history: 7d
          value_type: CHAR
          description: 'Supply description.'
        - uuid: c57c3acaf50a4f45a021812540a799d3
          name: 'Black Toner Level'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.43.11.1.1.9.1.1
          key: printer.toner.black.level
          delay: 5m
          history: 7d
          units: '%'
          description: 'Canon Cartridge 070 Black Toner; Printer-MIB supply level.'
          triggers:
            - uuid: 1ce6cb7361a14c96a1c012123168de2b
              expression: 'last(/Template Canon LBP242 II 243 II SNMP/printer.toner.black.level)<20 and last(/Template Canon LBP242 II 243 II SNMP/printer.toner.black.level)>=10'
              name: 'Printer black toner below 20%'
              priority: WARNING
              description: 'Black toner level is between 10% and 20%.'
              manual_close: 'YES'
            - uuid: 72bc455d93434fb88d3291e629f8c47a
              expression: 'last(/Template Canon LBP242 II 243 II SNMP/printer.toner.black.level)<10'
              name: 'Printer black toner critically low'
              priority: HIGH
              description: 'Black toner level is below 10%.'
              manual_close: 'YES'
        - uuid: e521b538bc1641d29c3a82396a5822b3
          name: 'Printer Uptime'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: printer.uptime
          history: 7d
          value_type: FLOAT
          units: uptime
          description: 'SNMP sysUpTime (timeticks converted to seconds).'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          triggers:
            - uuid: 2dac54e6e4ca4b3d96ca26ea0efad21f
              expression: 'change(/Template Canon LBP242 II 243 II SNMP/printer.uptime)<0'
              name: 'Printer reboot detected'
              priority: INFO
              description: 'SNMP sysUpTime decreased, indicating a reboot or SNMP agent restart.'
              manual_close: 'YES'
            - uuid: 26f5064626214d8e852af09e520a562f
              expression: 'nodata(/Template Canon LBP242 II 243 II SNMP/printer.uptime,5m)=1'
              name: 'Printer SNMP monitoring unavailable'
              priority: HIGH
              description: 'No SNMP response from the printer for 5 minutes.'
              manual_close: 'YES'
      tags:
        - tag: class
          value: printer
        - tag: model
          value: 'LBP242 II/243 II'
        - tag: snmp_version
          value: v1
        - tag: vendor
          value: Canon
      macros:
        - macro: '{$CANON.TONER.BASE.PAGES}'
          value: '0'
          description: 'From life time page counter'
        - macro: '{$SNMP_COMMUNITY}'
          value: public
          description: 'SNMP v1 community. Host er SNMP interface e community field e {$SNMP_COMMUNITY} deben.'
